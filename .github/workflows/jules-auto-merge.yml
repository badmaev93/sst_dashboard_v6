name: Auto-merge Jules PRs

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Trigger if branch name starts with jules-
    if: startsWith(github.head_ref, 'jules-')
    
    steps:
      - name: Enable auto-merge
        run: |
          if ! gh pr merge --auto --merge "$PR_URL"; then
            echo "Auto-merge failed. Attempting to update branch..."
            gh pr update-branch "$PR_URL" || true
            sleep 5
            gh pr merge --auto --merge "$PR_URL" || echo "Auto-merge still failed, continuing."
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
